name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the package version comes from the git tag

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The tests need no hardware, no Inkscape and no system libraries: rendering is
      # exercised through the encoder/protocol layers, USB through the mock link.
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip list

      - name: Run tests
        run: python -m pytest -q
