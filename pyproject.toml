[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "j1x0-cardprinter"
version = "0.1.0"
description = "Print SVG card designs on J1x0-series card printers over raw USB"
requires-python = ">=3.10"
authors = [
    { name = "Chris Shucksmith", email = "chris@shucksmith.co.uk" },
]
dependencies = [
    "pyusb>=1.2",
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
svg = ["cairosvg>=2.7"]   # alternative to the Inkscape CLI rasteriser
dev = ["pytest>=8"]

[project.scripts]
j1x0 = "j1x0_cardprinter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["j1x0_cardprinter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
