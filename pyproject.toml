[build-system]
requires = ["hatchling>=1.21", "hatch-vcs>=0.4", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "j1x0-cardprinter"
dynamic = ["version", "readme"]
description = "Print SVG card designs on J1x0-series card printers over raw USB"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Chris Shucksmith", email = "chris@shucksmith.co.uk" },
]
keywords = ["card printer", "id card", "dye-sublimation", "svg", "usb", "libusb", "j110i"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "pyusb>=1.2",
    "pillow>=10",
]

[project.optional-dependencies]
svg = ["cairosvg>=2.7"]   # alternative to the Inkscape CLI rasteriser
dev = ["pytest>=8"]

[project.scripts]
j1x0 = "j1x0_cardprinter.cli:main"

[project.urls]
Homepage      = "https://github.com/TeaEngineering/j1x0-cardprinter"
Repository    = "https://github.com/TeaEngineering/j1x0-cardprinter"
Documentation = "https://github.com/TeaEngineering/j1x0-cardprinter/tree/main/docs"
Issues        = "https://github.com/TeaEngineering/j1x0-cardprinter/issues"

# ── Build / packaging ─────────────────────────────────────────────────────────

[tool.hatch.version]
source = "vcs"

# PyPI shows the README out of context, so make its relative links and image absolute.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/TeaEngineering/j1x0-cardprinter/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '<img src="(?!https?://)([^"]+)"'
replacement = '<img src="https://raw.githubusercontent.com/TeaEngineering/j1x0-cardprinter/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?<!!)\[([^\]]*)\]\((?!https?://|#|mailto:)([^)]+)\)'
replacement = '[\1](https://github.com/TeaEngineering/j1x0-cardprinter/blob/main/\2)'

[tool.hatch.build.targets.wheel]
packages = ["j1x0_cardprinter"]

[tool.hatch.build.targets.sdist]
include = [
    "/j1x0_cardprinter",
    "/docs",
    "/examples",
    "/tests",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "**/__pycache__",
    "**/.DS_Store",
]

# ── Test ──────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
